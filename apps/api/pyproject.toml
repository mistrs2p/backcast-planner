[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backcasting-api"
version = "0.1.0"
description = "Backcasting Goal & Adaptive Planning System — FastAPI backend"
requires-python = ">=3.12,<3.14"
# Exact pins verified by TASK-009 against official sources; see
# docs/adr/ADR-007-technology-versions.md for rationale and sources.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.53",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "redis==8.1.0",
    # IANA timezone database for zoneinfo (required on Windows; fallback on
    # systems without a system tz database).
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    # httpx2 backs FastAPI's TestClient used by the application test suite
    # (starlette deprecates the original httpx for TestClient).
    "httpx2==2.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
